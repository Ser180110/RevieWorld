<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RevieWorld · offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, sans-serif; background: #fafafa; color: #18181b; text-align: center; padding: 24px; box-sizing: border-box; }
      @media (prefers-color-scheme: dark) { body { background: #09090b; color: #f4f4f5; } }
      img { width: 96px; height: 96px; border-radius: 22px; }
      button { margin-top: 16px; border: 0; border-radius: 999px; padding: 12px 24px; font-size: 16px; font-weight: 600; background: #18181b; color: #fff; cursor: pointer; }
      @media (prefers-color-scheme: dark) { button { background: #f4f4f5; color: #18181b; } }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sei offline</h1>
      <p>Controlla la connessione e riprova.<br />You're offline: check your connection.</p>
      <button onclick="location.reload()">Riprova</button>
    </main>
  </body>
</html>
